# SPDX-License-Identifier: GPL-3.0-or-later

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "re-ak-core"
version = "1.0.1"
description = "RE-AK open processing core: Hermès EEG / fEMG and Shimmer EDA / PPG signal processing and emotion models"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "RE-AK Technologies Inc." }]
keywords = ["EEG", "EMG", "EDA", "PPG", "emotion recognition", "biosignals", "Hermes", "Shimmer"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# The emotion model releases were saved with scikit-learn 1.6.1: keep the 1.6 series.
# scipy 1.18 changes filtfilt results by ~1e-6, which flips rounded values in the references: keep the 1.17 series.
dependencies = [
    "numpy>=2.5,<3",
    "scipy>=1.17,<1.18",
    "pandas>=2.3",
    "scikit-learn==1.6.*",
    "joblib>=1.6",
    "cvxopt>=1.3",
    "neurokit2>=0.2.10",
    "matplotlib>=3.11",
]

[project.urls]
Homepage = "https://github.com/fs-re-ak/re-ak-core"
Source = "https://github.com/fs-re-ak/re-ak-core"
Issues = "https://github.com/fs-re-ak/re-ak-core/issues"
Changelog = "https://github.com/fs-re-ak/re-ak-core/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17"]

[project.scripts]
reak-core = "reak_core.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reak_core = ["models/releases/**/*", "tools/channel_fix_models/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tools", "tests"]
extend-exclude = ["src/reak_core/models/releases", "src/reak_core/eda/cvxEDA.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-local-folder = ["refkit", "synthetic", "_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
